[platformio]
default_envs = deep_sleep

[env]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = direct
build_unflags = -std=gnu++11
build_flags = -std=gnu++2a

[env:compare]
build_src_filter = -<*> +<vd1_cac_che_do.cpp>

[env:deep_sleep]
build_src_filter = -<*> +<vd2_deep_sleep.cpp>

[env:deep_sleep_button]
extends = env:deep_sleep
build_flags = ${env.build_flags} -DENABLE_EXT0=1
