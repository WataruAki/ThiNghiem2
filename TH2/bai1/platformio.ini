[platformio]
default_envs = millis

[env]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
; Conservative configuration: 4 MB flash, no PSRAM dependency.
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = direct
build_unflags = -std=gnu++11
build_flags = -std=gnu++2a

[env:delay]
build_src_filter = -<*> +<vd1_dung_delay.cpp>

[env:millis]
build_src_filter = -<*> +<vd2_non_blocking.cpp>

[env:hardware]
build_src_filter = -<*> +<vd3_timer_phan_cung.cpp>

[env:delay_busy]
extends = env:delay
build_flags = ${env.build_flags} -DBUSY_DEMO=1

[env:millis_busy]
extends = env:millis
build_flags = ${env.build_flags} -DBUSY_DEMO=1

[env:hardware_busy]
extends = env:hardware
build_flags = ${env.build_flags} -DBUSY_DEMO=1
